# Jellyfin 播放信息改写层：放在 MediaWarp-Jellyfin 前面，其余请求原样转发。
load_module /etc/nginx/modules/ngx_http_js_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    js_import rewrite from /etc/nginx/playback/rewrite.js;

    # 日志不记录查询参数，避免写入令牌
    log_format playback '$time_iso8601 $status $request_method $uri host=$http_host xfp=$http_x_forwarded_proto';
    access_log /dev/stdout playback;

    # 用 Docker 内置 DNS 解析，MediaWarp 容器重建后不用重启本容器
    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    server {
        listen 9000;
        client_max_body_size 0;
        # 播放信息的请求体要留在内存里，才能原样转发给上游
        client_body_buffer_size 1m;

        set $mediawarp MediaWarp-Jellyfin:9000;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 只拦截播放信息接口
        location ~* ^/Items/[^/]+/PlaybackInfo$ {
            js_content rewrite.playbackInfo;
        }

        # 供 rewrite.js 取上游原始响应，外部不可访问
        location ^~ /__upstream/ {
            internal;
            proxy_set_header Accept-Encoding "";
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 16 64k;
            subrequest_output_buffer_size 4m;
            rewrite ^/__upstream/(.*)$ /$1 break;
            proxy_pass http://$mediawarp;
        }

        location / {
            proxy_pass http://$mediawarp;
        }
    }
}
