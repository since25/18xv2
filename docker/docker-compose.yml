services:
  postgres:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-organizer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8010:80"
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/organizer}
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 持久化数据：token 刷新状态、QR cookies、登录态等
      - ../data:/app/data
      # Emby 媒体动作需要在容器内按服务器原始路径扫描和删除 STRM。
      - /mnt/cache/docker1/alist-strm/video:/mnt/cache/docker1/alist-strm/video
      # 脚本中心 MOVE / DEL：SSD_cache 是 DEL 删除和整理、MOVE 的源；disk2/qbbtdn 是 DEL 删除和整理、MOVE 的目标。
      # 容器内路径与宿主机一致，运行名单可直接对照。原来单独挂的 /mnt/disk2/qbbtdn/已整理 已包含在下面，
      # Jellyfin 本地媒体（扫描与旁路封面）使用的路径不变。
      - /mnt/cache/docker1/SSD_cache:/mnt/cache/docker1/SSD_cache
      - /mnt/disk2/qbbtdn:/mnt/disk2/qbbtdn
      - /mnt/user/docker1/alist-strm/video/302porn_tv1:/mnt/user/docker1/alist-strm/video/302porn_tv1:ro
    restart: unless-stopped
