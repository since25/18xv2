[project]
name = "18x-organizer"
version = "0.2.0"
description = "115 file organization tool with keyword management, planning, and p115client Open API integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "p115client==0.0.9.3.6",
  # p115client 的间接依赖（同一作者的小库）只写下限且经常不兼容地升级，
  # 例如 python-asynctools 0.2.x 删掉了 to_list，导致 import p115client 失败。
  # 这里统一锁到 p115client 固定当时（2026-07-03）的版本；升级 p115client 时一并重新解析这一组。
  "cachedict==0.0.7",
  "ed2k==0.0.2.2",
  "errno2==0.0.5",
  "glob_pattern==0.0.2",
  "http_response==0.0.9",
  "id2dirnode==0.0.2",
  "integer_tool==0.0.6.1",
  "iter_collect==0.0.6",
  "iterdir==0.0.10",
  "p115cipher==0.0.5.2",
  "p115oss==0.1.0.3",
  "p115pickcode==0.0.5.4",
  "posixpatht==0.0.4",
  "python-argtools==0.0.3",
  "python-asynctools==0.1.3.4",
  "python-concurrenttools==0.1.4",
  "python-cookietools==0.1.5",
  "python-decotools==0.0.4",
  "python-dictattr==0.0.4",
  "python-dicttools==0.0.5",
  "python-download==0.0.4.1",
  "python-encode_uri==0.0.3",
  "python-ensure==0.0.2",
  "python-filewrap==0.3.0",
  "python-hashtools==0.0.6",
  "python-http_request==0.1.7.1",
  "python-httpfile==0.0.6",
  "python-iterutils==0.2.10.2",
  "python-property==0.0.3",
  "python-startfile==0.0.3",
  "python-temporary==0.0.1",
  "python-texttools==0.0.6",
  "python-undefined==0.0.4",
  "socket_keepalive==0.0.1",
  "sqlitetools==0.1.2",
  "urllib3_future_request==0.0.2",
  "pillow>=10.4.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "requests>=2.32.0",
  "psycopg[binary]>=3.2.0",
  "qrcode>=8.2",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 用 importlib 导入模式，避免不同子目录下同名测试文件（如多个
# test_delete_plan_service.py）在默认 prepend 模式下收集冲突
addopts = "--import-mode=importlib"

[tool.alembic]
script_location = "alembic"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
